name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.deleted == false }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare version and commit changelog
        id: version
        run: >-
          python3 -B scripts/release_notes.py "$RELEASE_TAG"
          --repository "$GITHUB_REPOSITORY"
          --output .build/release/CHANGELOG.md
          --github-output "$GITHUB_OUTPUT"
      - name: Test release tooling
        run: |
          bash -n scripts/build.sh scripts/package-release.sh
          python3 -B -m unittest discover -s scripts/tests -v
      - name: Run Swift tests
        run: swift test
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Package Apple Silicon and Intel DMGs
        run: ./scripts/package-release.sh "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$IS_PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "gogo $RELEASE_TAG" \
            --notes-file .build/release/CHANGELOG.md \
            "${flags[@]}" \
            ".build/release/gogo-${RELEASE_TAG}-arm64.dmg" \
            ".build/release/gogo-${RELEASE_TAG}-x86_64.dmg" \
            .build/release/SHA256SUMS.txt
