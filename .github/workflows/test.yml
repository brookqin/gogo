name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test release tooling
        run: |
          bash -n scripts/build.sh scripts/package-release.sh
          python3 -B -m unittest discover -s scripts/tests -v
      - name: Run Swift tests
        run: swift test
      - name: Build app and Finder extension
        run: ./scripts/build.sh CODE_SIGNING_ALLOWED=NO
